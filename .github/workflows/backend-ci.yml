name: backend-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tracking
          POSTGRES_PASSWORD: tracking
          POSTGRES_DB: tracking_test # tests bind DATABASE_URL to tracking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracking"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e "backend[dev]"

      - name: Lint
        run: ruff check backend/app backend/simulator backend/tests

      - name: Tests (real PostgreSQL)
        working-directory: backend
        run: pytest -q --cov=app --cov-report=term-missing
